<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cómo te atendimos?</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --rojo: #C8102E; --negro: #141414; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f5; color: var(--negro); }
  main { max-width: 460px; margin: 0 auto; padding: 24px 18px 40px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: #666; margin: 0 0 20px; }
  .tarjeta { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tarjeta h2 { font-size: 1rem; margin: 0 0 10px; }
  .estrellas { display: flex; gap: 6px; justify-content: space-between; }
  .estrellas button { flex: 1; font-size: 2rem; line-height: 1; padding: 8px 0; border: 0; background: #f4f4f5; border-radius: 12px; color: #c7c7cc; cursor: pointer; }
  .estrellas button.on { color: #f5b301; background: #fff7e0; }
  textarea, input { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 12px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  .enviar { width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700; color: #fff; background: var(--rojo); border: 0; border-radius: 14px; cursor: pointer; }
  .enviar:disabled { opacity: .5; }
  .msg { text-align: center; padding: 40px 10px; }
  .msg b { font-size: 1.4rem; display: block; margin-bottom: 8px; }
  .error { color: #b91c1c; margin: 10px 0; text-align: center; }
  small { color: #888; }
</style>
</head>
<body>
<main id="app"><p class="msg">Cargando…</p></main>
<script>
const URL_API = 'https://slmtounvjbyloyodntdh.supabase.co', LLAVE = 'sb_publishable_nxV_wscrwWSM8TKBJO8PKw_IGgUi17L';
const q = new URLSearchParams(location.search);
const suc = Number(q.get('s')), folio = (q.get('f') || '').slice(0, 30), desdeMenu = q.get('menu') === '1';
const app = document.getElementById('app');
const rpc = async (fn, body) => {
  const r = await fetch(`${URL_API}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: LLAVE, Authorization: `Bearer ${LLAVE}` }, body: JSON.stringify(body) });
  const t = await r.text(); const d = t ? JSON.parse(t) : null;
  if (!r.ok) throw new Error((d && d.message) || 'error');
  return d;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const EN = q.get('lang') === 'en';
const L = EN ? { carga: 'Loading…', incompleto: '<b>Incomplete link</b>Scan the code on your receipt.', noTicket: '<b>We couldn’t find your receipt</b>The survey is available for 10 days after your visit.',
  gracias: (m) => `<b>Thank you!</b>We already received your feedback for this visit to ${m}.`, titulo: 'How did we do?', general: 'Overall experience', comida: 'Food', servicio: 'Service',
  algo: 'Anything you’d like to tell us?', opcional: 'Optional', cel: 'Your phone', celNota: '(optional, in case we need to reach you)', digitos: '10 digits', enviar: 'Send',
  folio: 'check', error: 'Could not send. Please try again.', ok: (m) => `<b>Thanks for your feedback!</b>It helps us serve you better at ${m}.` }
 : { carga: 'Cargando…', incompleto: '<b>Enlace incompleto</b>Escanea el código de tu ticket.', noTicket: '<b>No encontramos tu ticket</b>La encuesta está disponible 10 días después de tu visita.',
  gracias: (m) => `<b>¡Gracias!</b>Ya recibimos tu opinión de esta visita a ${m}.`, titulo: '¿Cómo te atendimos?', general: 'Tu experiencia en general', comida: 'La comida', servicio: 'El servicio',
  algo: '¿Algo que quieras contarnos?', opcional: 'Opcional', cel: 'Tu celular', celNota: '(opcional, por si necesitamos contactarte)', digitos: '10 dígitos', enviar: 'Enviar',
  folio: 'folio', error: 'No se pudo enviar. Intenta de nuevo.', ok: (m) => `<b>¡Gracias por tu opinión!</b>Nos ayuda a atenderte mejor en ${m}.` };
if (EN) { document.documentElement.lang = 'en'; document.title = L.titulo; }
const v = { calificacion: 0, comida: 0, servicio: 0 };
function estrellas(clave) {
  return `<div class="estrellas" data-k="${clave}">${[1,2,3,4,5].map((n) => `<button type="button" data-n="${n}" aria-label="${n} estrellas">★</button>`).join('')}</div>`;
}
function pintar() {
  document.querySelectorAll('.estrellas').forEach((e) => e.querySelectorAll('button').forEach((b) => b.classList.toggle('on', Number(b.dataset.n) <= v[e.dataset.k])));
  document.getElementById('enviar').disabled = !v.calificacion;
}
async function iniciar() {
  if (!suc || (!folio && !desdeMenu)) { app.innerHTML = `<p class="msg">${L.incompleto}</p>`; return; }
  let info = null;
  try { info = desdeMenu && !folio ? await rpc('pos_sucursal_publica', { p_sucursal: suc }) : await rpc('pos_encuesta_info', { p_sucursal: suc, p_folio: folio }); } catch (e) { /* sin datos */ }
  if (!info) { app.innerHTML = `<p class="msg">${L.noTicket}</p>`; return; }
  if (info.contestada) { app.innerHTML = `<p class="msg">${L.gracias(esc(info.marca))}</p>`; return; }
  app.innerHTML = `
    <h1>${L.titulo}</h1>
    <p class="sub">${esc(info.marca)} · ${esc(info.sucursal)}${folio ? ` · ${L.folio} ${esc(folio)}` : ''}</p>
    <div class="tarjeta"><h2>${L.general}</h2>${estrellas('calificacion')}</div>
    <div class="tarjeta"><h2>${L.comida}</h2>${estrellas('comida')}</div>
    <div class="tarjeta"><h2>${L.servicio}</h2>${estrellas('servicio')}</div>
    <div class="tarjeta"><h2>${L.algo}</h2><textarea id="com" maxlength="600" placeholder="${L.opcional}"></textarea></div>
    <div class="tarjeta"><h2>${L.cel} <small>${L.celNota}</small></h2><input id="tel" inputmode="numeric" maxlength="10" placeholder="${L.digitos}"></div>
    <div id="err" class="error"></div>
    <button id="enviar" class="enviar" disabled>${L.enviar}</button>`;
  document.querySelectorAll('.estrellas').forEach((e) => e.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return; v[e.dataset.k] = Number(b.dataset.n); pintar();
  }));
  document.getElementById('enviar').onclick = async () => {
    const btn = document.getElementById('enviar'); btn.disabled = true;
    try {
      const datos = { p_sucursal: suc, p_calificacion: v.calificacion, p_comida: v.comida || null, p_servicio: v.servicio || null,
        p_comentario: document.getElementById('com').value || null, p_telefono: document.getElementById('tel').value || null };
      if (folio) await rpc('pos_encuesta_publica', { ...datos, p_folio: folio }); else await rpc('pos_encuesta_menu', datos);
      app.innerHTML = `<p class="msg">${L.ok(esc(info.marca))}</p>`;
    } catch (e) { document.getElementById('err').textContent = L.error; btn.disabled = false; }
  };
  pintar();
}
iniciar();
</script>
</body>
</html>
